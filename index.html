<!-- shared filters and gradients for the drawings -->
<svg class="defs" aria-hidden="true">
  <defs>
    <!-- the soft frayed cut-out, for the 2D close-ups -->
    <filter id="fuzzc" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
      <feComponentTransfer in="b" result="m"><feFuncA type="linear" slope="16" intercept="-7.4"/></feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="m" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".18" result="s"/>
      <feFlood flood-color="#fdfdfd"/>
      <feComposite operator="in" in2="s"/>
    </filter>
    <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd" stop-opacity=".55"/><stop offset=".45" stop-color="#d6e9f6" stop-opacity=".2"/><stop offset="1" stop-color="#d6e9f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gPool"><stop offset="0" stop-color="#d6e9f6" stop-opacity=".75"/><stop offset=".55" stop-color="#aed1ea" stop-opacity=".22"/><stop offset="1" stop-color="#aed1ea" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fdfdfd"/><stop offset=".25" stop-color="#d6e9f6" stop-opacity=".7"/><stop offset="1" stop-color="#aed1ea" stop-opacity="0"/></radialGradient>
  </defs>
</svg>
