<body>
<!-- shared filters and gradients for every scene -->
<svg class="defs" aria-hidden="true">
  <defs>
    <!-- the fuzzy white cut-out look: melt the body parts together, then fray the edge -->
    <filter id="fuzz" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
      <feComponentTransfer in="b" result="m"><feFuncA type="linear" slope="16" intercept="-7.4"/></feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="m" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".3" result="s"/>
      <feFlood flood-color="#fdfdfd"/>
      <feComposite operator="in" in2="s"/>
    </filter>
    <!-- the same, finer, for close-ups -->
    <filter id="fuzzc" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
      <feComponentTransfer in="b" result="m"><feFuncA type="linear" slope="16" intercept="-7.4"/></feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="m" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".18" result="s"/>
      <feFlood flood-color="#fdfdfd"/>
      <feComposite operator="in" in2="s"/>
    </filter>
    <!-- frayed edges for things that aren't people (paper, leaves, clouds) -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".35" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b8" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b16" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd" stop-opacity=".75"/><stop offset=".45" stop-color="#d6e9f6" stop-opacity=".3"/><stop offset="1" stop-color="#d6e9f6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gPool"><stop offset="0" stop-color="#d6e9f6" stop-opacity=".9"/><stop offset=".55" stop-color="#aed1ea" stop-opacity=".3"/><stop offset="1" stop-color="#aed1ea" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fdfdfd"/><stop offset=".25" stop-color="#d6e9f6" stop-opacity=".7"/><stop offset="1" stop-color="#aed1ea" stop-opacity="0"/></radialGradient>
    <linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".55" stop-color="#555"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="mRefl" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#gFade)"/></mask>
  </defs>
</svg>
